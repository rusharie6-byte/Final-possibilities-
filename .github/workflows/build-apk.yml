name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application Assets
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Ensure Gradle Wrapper & Fixed Keystore
        run: |
          mkdir -p android/gradle/wrapper android/app
          if [ -f "android/gradle/wrapper/gradle-wrapper.jar.b64" ]; then
            echo "Decoding gradle-wrapper.jar from committed base64..."
            base64 -d android/gradle/wrapper/gradle-wrapper.jar.b64 > android/gradle/wrapper/gradle-wrapper.jar
          fi
          if ! unzip -t android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Jar missing or invalid, fetching official gradle-wrapper.jar..."
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          fi
          unzip -l android/gradle/wrapper/gradle-wrapper.jar | grep GradleWrapperMain || true

          if [ -f "android/app/keystore.b64" ]; then
            echo "Decoding committed fixed signing keystore..."
            base64 -d android/app/keystore.b64 > android/app/debug.keystore
          elif [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Possibilities, OU=Development, O=Possibilities, L=City, S=State, C=US"
          fi

      - name: Ensure Executable Permission for Gradle
        run: chmod +x android/gradlew

      - name: Compile Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: possibilities-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
