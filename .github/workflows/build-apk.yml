name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Fixed Signing Keystore
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating fixed Android debug.keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Possibilities, OU=Development, O=Possibilities, L=City, S=State, C=US"
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || ! unzip -t "gradle/wrapper/gradle-wrapper.jar" >/dev/null 2>&1; then
            echo "Gradle wrapper jar missing or corrupt, fetching clean wrapper jar..."
            curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Possibilities-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
