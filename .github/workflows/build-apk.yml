name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          if [ -f "android/gradle/wrapper/gradle-wrapper.jar.b64" ]; then
            echo "Restoring gradle-wrapper.jar from committed base64..."
            base64 -d android/gradle/wrapper/gradle-wrapper.jar.b64 > android/gradle/wrapper/gradle-wrapper.jar
          fi
          if [ ! -s "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Fetching gradle-wrapper.jar from official Gradle repository..."
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Ensure Fixed Signing Keystore
        run: |
          mkdir -p android/app
          if [ -f "android/app/keystore.b64" ]; then
            echo "Decoding committed fixed signing keystore..."
            base64 -d android/app/keystore.b64 > android/app/debug.keystore
          elif [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Possibilities, OU=Development, O=Possibilities, L=City, S=State, C=US"
          fi

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
