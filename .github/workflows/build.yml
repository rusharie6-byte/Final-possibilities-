name: Build Mobile Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Ensure Fixed Signing Keystore & Wrapper
        run: |
          mkdir -p android/app android/gradle/wrapper
          if [ -f "android/gradle/wrapper/gradle-wrapper.jar.b64" ]; then
            echo "Restoring gradle-wrapper.jar from committed base64..."
            base64 -d android/gradle/wrapper/gradle-wrapper.jar.b64 > android/gradle/wrapper/gradle-wrapper.jar
          fi
          if [ ! -s "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Fetching gradle-wrapper.jar from official Gradle repository..."
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          fi
          if [ -f "android/app/keystore.b64" ]; then
            echo "Decoding committed fixed signing keystore..."
            base64 -d android/app/keystore.b64 > android/app/debug.keystore
          elif [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Possibilities, OU=Development, O=Possibilities, L=City, S=State, C=US"
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Possibilities-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Simulator App
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath ios/App/build CODE_SIGNING_ALLOWED=NO build

      - name: Zip iOS App Bundle
        run: |
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r Possibilities-iOS-App.zip App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Possibilities-iOS-App
          path: ios/App/build/Build/Products/Debug-iphonesimulator/Possibilities-iOS-App.zip
          if-no-files-found: error
